## Simulator, "gas" example. Run: esphome run firmware/sim_gas.yaml

substitutions:
  chart_demo: "true"   # top level so it wins over ui.yaml

esphome:
  name: energy-display-sim-gas

packages:
  base: !include sim_base.yaml
  ui: !include ui.yaml
  tile1: !include { file: tiles/boiler_gas.yaml, vars: { slot: 1, flow_temp: sensor.a, flame: binary_sensor.b, modulation: sensor.c, gas_today: sensor.d, pressure: sensor.e } }
  tile2: !include { file: tiles/dhw.yaml, vars: { slot: 2, temp: sensor.g, pump: sensor.h, on_below: number.p, off_at: number.q, source: "caldaia a gas" } }
  tile3: !include { file: tiles/ev_charger.yaml, vars: { slot: 3, power: sensor.i, energy: sensor.j } }
  tile4: !include { file: tiles/pv.yaml, vars: { slot: 4, pv_today: sensor.m, exported_today: sensor.n, imported_today: sensor.o } }
