## Tile: solar production today and grid exchange (uses fc_today_kwh / fc_tomorrow_kwh / weather_cond from the core)
## vars: slot (1-4), pv_today, exported_today, imported_today (kWh)
sensor:
  - { platform: homeassistant, id: pv_today, entity_id: "${pv_today}" }
  - { platform: homeassistant, id: pv_exp, entity_id: "${exported_today}" }
  - { platform: homeassistant, id: pv_imp, entity_id: "${imported_today}" }

script:
  - id: tile_fill_${slot}
    then:
      - lambda: |-
          float tm = id(fc_tomorrow_kwh).state;
          ui::tile(${slot}, "\U000F05A8", 0xFFC531, ui::fmt(id(pv_today).state, "%.0f kWh"),
                   std::isnan(tm) ? "Sole oggi" : tm >= ${sunny_tomorrow_kwh} ? "Domani: sole" : "Domani: nuvole");
  - id: tile_popup_${slot}
    then:
      - lambda: |-
          // how today's weather affects the panels
          static const std::map<std::string, const char *> WX = {
            {"sunny", "Con il cielo sereno i pannelli rendono al massimo, soprattutto tra le 11 e le 15. "},
            {"clear-night", "Con il cielo sereno i pannelli rendono al massimo, soprattutto tra le 11 e le 15. "},
            {"partlycloudy", "Con qualche nuvola la produzione va e viene: approfitta dei momenti di sole. "},
            {"cloudy", "Con il cielo coperto i pannelli producono circa un quarto del solito. "},
            {"fog", "Con la nebbia i pannelli producono molto poco. "},
            {"rainy", "Con la pioggia i pannelli producono pochissimo, anche dieci volte meno di una giornata di sole. "},
            {"pouring", "Con la pioggia i pannelli producono pochissimo, anche dieci volte meno di una giornata di sole. "},
            {"snowy", "Con la neve sui pannelli la produzione si ferma quasi del tutto. "},
            {"snowy-rainy", "Con pioggia e neve i pannelli producono pochissimo. "}};
          auto wx = WX.find(id(weather_cond).state);
          std::string weather_txt = wx == WX.end() ? "" : wx->second;
          ui::popup("\U000F05A8", 0xFFC531, "Fotovoltaico", ui::fmt(id(pv_today).state, "%.0f kWh"),
              "Prodotta oggi\nVenduta oggi\nComprata oggi\nPrevista oggi\nPrevista domani",
              ui::fmt(id(pv_today).state, "%.0f kWh") + "\n" + ui::fmt(id(pv_exp).state, "%.0f kWh") + "\n"
                  + ui::fmt(id(pv_imp).state, "%.0f kWh") + "\n" + ui::fmt(id(fc_today_kwh).state, "%.0f kWh") + "\n"
                  + ui::fmt(id(fc_tomorrow_kwh).state, "%.0f kWh"),
              weather_txt + "Vendiamo a circa ${price_sell_cent} centesimi e compriamo a circa ${price_buy_cent}: "
              "meglio usarla quando il semaforo è verde.");
  - id: tile_demo_${slot}
    then:
      - lambda: 'id(pv_today).publish_state(82.4); id(pv_exp).publish_state(41.3); id(pv_imp).publish_state(12.8);'
