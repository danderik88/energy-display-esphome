                  width: 88
                  height: 88
                  radius: 44
                  border_width: 0
                  bg_color: 0xFFFFFF
                  bg_opa: 22%
                  scrollable: false
                  widgets:
                    - label: { id: sem_icon, align: CENTER, text: "\U000F0026", text_font: i_xl, text_color: 0xFFFFFF }
              - label: { id: sem_title, x: 126, y: 18, text: "Avvio...", text_font: f_h1, text_color: 0xFFFFFF }
              - label: { id: sem_sub, x: 128, y: 66, width: 630, long_mode: WRAP, text: "", text_font: f_body, text_color: 0xFFFFFF, text_opa: 88% }

        # ── Pills: casa / rete / batteria ──
        - obj:
            styles: st_panel
            x: 10
            y: 186
            width: 254
            height: 46
            radius: 23
            scrollable: false
            layout: { type: flex, flex_flow: ROW, flex_align_main: CENTER, flex_align_cross: CENTER, flex_align_track: CENTER, pad_column: 8 }
            widgets:
              - label: { text: "\U000F02DC", text_font: i_s, text_color: $c_blue }
              - label: { id: lbl_load, text: "Casa --" }
        - obj:
            styles: st_panel
            x: 273
            y: 186
            width: 254
            height: 46
            radius: 23
            scrollable: false
            layout: { type: flex, flex_flow: ROW, flex_align_main: CENTER, flex_align_cross: CENTER, flex_align_track: CENTER, pad_column: 8 }
            widgets:
              - label: { text: "\U000F0D3E", text_font: i_s, text_color: $c_muted }
              - label: { id: lbl_grid, text: "Rete --" }
        - obj:
            styles: st_panel
            x: 536
            y: 186
            width: 254
            height: 46
            radius: 23
            scrollable: false
            layout: { type: flex, flex_flow: ROW, flex_align_main: CENTER, flex_align_cross: CENTER, flex_align_track: CENTER, pad_column: 10 }
            widgets:
              - label: { text: "\U000F0079", text_font: i_s, text_color: $c_green }
              - bar:
                  id: bar_batt
                  width: 90
                  height: 12
                  min_value: 0
                  max_value: 100
                  value: 0
                  bg_color: 0x2C343D
                  bg_opa: COVER
                  radius: 6
                  indicator: { bg_color: $c_green, bg_opa: COVER, radius: 6 }
              - label: { id: lbl_batt, text: "--" }

        # ── Today's chart (bars created by the 30 s interval lambda) ──
        - obj:
            styles: st_panel
            x: 10
            y: 240
            width: 780
            height: 150
            scrollable: false
            widgets:
              - label: { x: 14, y: 8, text: "Corrente venduta e comprata, ultime 24 ore", text_font: f_body }
              - obj:
                  styles: st_flat
                  align: TOP_RIGHT
                  x: -14
                  y: 12
                  width: SIZE_CONTENT
                  height: SIZE_CONTENT
                  scrollable: false
                  layout: { type: flex, flex_flow: ROW, flex_align_cross: CENTER, pad_column: 6 }
                  widgets:
                    - obj: { width: 12, height: 12, radius: 6, bg_color: $c_green, border_width: 0 }
                    - label: { text: "venduta  ", text_font: f_small, styles: st_muted }
                    - obj: { width: 12, height: 12, radius: 6, bg_color: $c_red, border_width: 0 }
                    - label: { text: "comprata", text_font: f_small, styles: st_muted }
              - label: { align: TOP_RIGHT, x: -10, y: 128, text: "ora", text_font: f_small, styles: st_muted }
              - obj:
                  id: chart_box
                  styles: st_flat
                  x: 6
                  y: 38
                  width: 768
                  height: 92
                  scrollable: false
                  widgets:
                    - obj: { x: 0, y: 46, width: 768, height: 1, bg_color: 0x3A434D, bg_opa: COVER, border_width: 0, radius: 0 }

