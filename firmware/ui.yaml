            id: sem_panel
            x: 10
            y: 56
            width: 780
            height: 122
            radius: 20
            border_width: 0
            pad_all: 0
            bg_color: $c_grey
            bg_grad_color: $c_grey_dk
            bg_grad_dir: HOR
            bg_opa: COVER
            scrollable: false
            widgets:
              - obj:
                  align: LEFT_MID
